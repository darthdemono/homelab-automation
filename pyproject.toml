[project]
name = "homelab-automation"
version = "0.1.0"
description = "A small plugin engine for homelab automation: plan first, apply what was reviewed, undo anything."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jubair Hasan (DarthDemono)" }]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13", "pyyaml>=6", "homelab-plugin-api", "homelab-plugin-nextcloud", "homelab-plugin-jellyfix", "homelab-plugin-musicfix", "homelab-plugin-arr", "homelab-plugin-qbittorrent", "homelab-plugin-jellyfin"]

[tool.uv.sources]
homelab-plugin-api = { workspace = true }
homelab-plugin-nextcloud = { workspace = true }
homelab-plugin-jellyfix = { workspace = true }
homelab-plugin-musicfix = { workspace = true }
homelab-plugin-jellyfin = { workspace = true }
homelab-plugin-qbittorrent = { workspace = true }
homelab-plugin-arr = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[project.scripts]
homelab = "homelab.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=6", "ruff>=0.15", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "homelab"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["custom"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S603", "S607", "E501"]
"fuzz/*" = ["S101"]
"tools/*" = ["S603", "S607"]
# scripts run external programs (docker, ffprobe) by design; the engine checks each exec against the manifest
"src/homelab/scripts/*" = ["S603", "S607"]
"src/homelab/runner.py" = ["S603"]
"src/homelab/report.py" = ["S603", "S607"]
"src/homelab/cli.py" = ["E501"]
# ported from the standalone jellyFix tool; kept close to the original so behaviour stays identical
"plugins/jellyfix/src/homelab_jellyfix/[!_]*.py" = ["S310", "S603", "S607", "S110", "SIM102", "SIM115", "E401", "E731", "E501", "B905"]
"plugins/jellyfix/src/homelab_jellyfix/__init__.py" = ["E501"]
# stages ported from the standalone musicFix tool keep its structure, so each port stays reviewable line by line
"plugins/musicfix/src/homelab_musicfix/*.py" = ["S310", "S603", "S607", "S110", "S108", "SIM102", "SIM108", "SIM115", "SIM118", "E401", "E731", "E741", "E501", "B905", "UP", "I001", "F401", "PLR"]
# secrets.py runs `unv` by name on purpose: UnENVerse is the recommended secret source
"src/homelab/secrets.py" = ["S603", "S606", "S607"]
