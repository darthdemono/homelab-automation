[project]
name = "homelab-plugin-nextcloud"
version = "0.1.0"
description = "Nextcloud DAV writes (calendars, contacts, files) that save a copy first and can be undone."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jubair Hasan (DarthDemono)" }]
requires-python = ">=3.13"
dependencies = ["homelab-plugin-api"]

[tool.uv.sources]
homelab-plugin-api = { workspace = true }

[project.entry-points."homelab.plugins"]
nextcloud = "homelab_nextcloud:PLUGIN"

[tool.uv.build-backend]
module-name = "homelab_nextcloud"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
