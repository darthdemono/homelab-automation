version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    # A release gets a week to be yanked or reported before it is proposed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
