[project]
name = "homelab-plugin-musicfix"
version = "0.1.0"
description = "Clean, merge, tag and analyse a music library: every file move and tag write is reviewed first and can be undone."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jubair Hasan (DarthDemono)" }]
requires-python = ">=3.13"
dependencies = ["homelab-plugin-api", "mutagen>=1.47", "numpy", "requests", "rapidfuzz"]

[tool.uv.sources]
homelab-plugin-api = { workspace = true }

[project.entry-points."homelab.plugins"]
musicfix = "homelab_musicfix:PLUGIN"

[tool.uv.build-backend]
module-name = "homelab_musicfix"

[build-system]
requires = ["uv_build>=0.11.8,<0.14.0"]
build-backend = "uv_build"
