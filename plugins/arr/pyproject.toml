[project]
name = "homelab-plugin-arr"
version = "0.1.0"
description = "Configure and repair Sonarr, Radarr, Prowlarr and Jackett: idempotent changes that record what they replaced."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jubair Hasan (DarthDemono)" }]
requires-python = ">=3.13"
dependencies = ["homelab-plugin-api", "requests"]

[tool.uv.sources]
homelab-plugin-api = { workspace = true }

[project.entry-points."homelab.plugins"]
arr = "homelab_arr:PLUGIN"

[tool.uv.build-backend]
module-name = "homelab_arr"

[build-system]
requires = ["uv_build>=0.11.8,<0.14.0"]
build-backend = "uv_build"
