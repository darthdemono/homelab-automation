name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  # Decides whether the code jobs have to run. A change that only touches documentation,
  # policy files or templates needs no build. Skipping is decided here, not with `paths:`
  # on the trigger, because the `CI result` job must always report: a required check that
  # never starts leaves a documentation-only pull request waiting forever.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed files
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "push" ]; then base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" "$HEAD_SHA" | grep -vE '^(docs/|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md|CODEOWNERS)|[A-Z_]+\.md$|LICENSE$|NOTICE$)' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q --cov=homelab --cov-report=term-missing --cov-fail-under=85

  lint:
    name: Lint and schemas
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Checked-in schemas match the code
        run: uv run python scripts/gen_schemas.py --check
      - name: Sample environment matches the code
        run: uv run python scripts/gen_env_example.py --check
      - name: Lockfile is current
        run: uv lock --check

  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job ended as '${r}'"; exit 1 ;;
            esac
          done
