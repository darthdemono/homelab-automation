name: Release

# Manual, from main, after CI passed in the same run. Builds the sdist and wheel, writes a
# CycloneDX SBOM, attests provenance and signs every asset keylessly from this workflow's
# identity, then publishes the GitHub release. PyPI publishing is off until the repository
# variable PUBLISH_PYPI is "true" and a trusted publisher is configured on PyPI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and sign
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing and provenance
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - run: uv sync --frozen
      - run: uv build --all-packages
      - name: SBOM
        run: uv export --frozen --format cyclonedx1.5 --no-emit-project -o dist/sbom.cdx.json
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign every asset
        run: |
          set -euo pipefail
          cd dist
          for f in *; do cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          artifacts: dist/*
          generateReleaseNotes: true
          skipIfReleaseExists: true

  pypi:
    name: Publish to PyPI
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: rm -f dist/*.sig dist/*.pem dist/SHA256SUMS dist/sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
