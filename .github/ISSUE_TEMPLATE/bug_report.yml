name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, tokens, ledger files or private paths. For a security
        problem use the private reporting form instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `homelab --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
