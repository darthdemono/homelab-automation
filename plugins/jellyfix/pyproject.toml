[project]
name = "homelab-plugin-jellyfix"
version = "0.1.0"
description = "Rename and verify Jellyfin libraries against TVDB and TMDB with TRaSH naming, reversible."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jubair Hasan (DarthDemono)" }]
requires-python = ">=3.13"
dependencies = ["homelab-plugin-api"]

[tool.uv.sources]
homelab-plugin-api = { workspace = true }

[project.entry-points."homelab.plugins"]
jellyfix = "homelab_jellyfix:PLUGIN"

[tool.uv.build-backend]
module-name = "homelab_jellyfix"

[build-system]
requires = ["uv_build>=0.11.8,<0.14.0"]
build-backend = "uv_build"
